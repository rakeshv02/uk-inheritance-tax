<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UK Inheritance Tax Calculator 2025/26 | Tabutility</title>
  <meta name="description" content="Calculate UK inheritance tax (IHT) for 2025/26. Includes nil rate band, residence nil rate band, spouse exemption and charitable relief." />
  <meta name="keywords" content="uk inheritance tax calculator, iht calculator, nil rate band, residence nil rate band, estate tax uk 2025" />
  <link rel="canonical" href="https://uk-inheritance-tax.tabutility.com/" />
  <meta property="og:title" content="UK Inheritance Tax Calculator 2025/26" />
  <meta property="og:description" content="Calculate UK IHT including nil rate bands and spouse/charity exemptions." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>" />
  <meta name="robots" content="index, follow" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7039091592734005" crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-78VZWJ5B1W"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;background:#f8faff;font-family:'Segoe UI',Arial,sans-serif">
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState } = React;
function fmt(n){return '£'+Math.round(n).toLocaleString('en-GB');}

function App() {
  const [estate, setEstate] = useState(800000);
  const [spouseDead, setSpouseDead] = useState(false);
  const [hasHome, setHasHome] = useState(true);
  const [homeValue, setHomeValue] = useState(400000);
  const [charity, setCharity] = useState(0);
  const [gifts, setGifts] = useState(0);

  const NRB = 325000;
  const RNRB = 175000;

  // Total nil rate band available
  let totalNRB = NRB;
  if (spouseDead) totalNRB += NRB; // transferred NRB
  let rnrb = 0;
  if (hasHome) {
    rnrb = Math.min(RNRB, Number(homeValue)||0);
    if (spouseDead) rnrb = Math.min(rnrb * 2, RNRB * 2, Number(homeValue)||0);
  }
  const totalThreshold = totalNRB + rnrb;
  const charityAmt = Number(charity)||0;
  const giftsAmt = Number(gifts)||0;
  const estateVal = Number(estate)||0;

  const taxableEstate = Math.max(0, estateVal - charityAmt - totalThreshold + giftsAmt);
  // Reduced rate if >= 10% to charity
  const charityPct = estateVal > 0 ? charityAmt / estateVal : 0;
  const ihtRate = charityPct >= 0.1 ? 0.36 : 0.40;
  const ihtDue = taxableEstate * ihtRate;
  const netEstate = estateVal - charityAmt - ihtDue;

  return (
    <div style={{maxWidth:520,margin:'0 auto',paddingBottom:40}}>
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>
      <div style={{background:'linear-gradient(135deg,#374151,#1f2937)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>🏛️</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>UK Inheritance Tax Calculator</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>IHT 2025/26 — nil rate band, RNRB &amp; exemptions</p>
      </div>
      <div style={{padding:20}}>
        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          <div style={{marginBottom:14}}>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Total Estate Value</label>
            <div style={{position:'relative'}}>
              <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280'}}>£</span>
              <input type="number" value={estate} onChange={e=>setEstate(e.target.value)}
                style={{width:'100%',padding:'11px 12px 11px 28px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
            </div>
          </div>

          {[
            ['Gifts in last 7 years (PETs)','£',gifts,setGifts],
            ['Charitable Donations','£',charity,setCharity],
          ].map(([l,p,v,s])=>(
            <div key={l} style={{marginBottom:14}}>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>{l}</label>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280'}}>{p}</span>
                <input type="number" value={v} onChange={e=>s(e.target.value)}
                  style={{width:'100%',padding:'11px 12px 11px 28px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
              </div>
            </div>
          ))}

          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {[[spouseDead,setSpouseDead,'Deceased spouse / civil partner (transfers their NRB)'],
              [hasHome,setHasHome,'Leaving home to direct descendants (RNRB applies)']
            ].map(([val,setter,label])=>(
              <label key={label} style={{display:'flex',alignItems:'flex-start',gap:10,cursor:'pointer',fontSize:13,color:'#374151'}}>
                <input type="checkbox" checked={val} onChange={e=>setter(e.target.checked)} style={{marginTop:2,accentColor:'#374151'}} />
                {label}
              </label>
            ))}
          </div>

          {hasHome && (
            <div style={{marginTop:14}}>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:6}}>Property Value (for RNRB)</label>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'#6b7280'}}>£</span>
                <input type="number" value={homeValue} onChange={e=>setHomeValue(e.target.value)}
                  style={{width:'100%',padding:'11px 12px 11px 28px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:16,boxSizing:'border-box'}} />
              </div>
            </div>
          )}
        </div>

        <div style={{background: ihtDue > 0 ? 'linear-gradient(135deg,#fef2f2,#fee2e2)':'linear-gradient(135deg,#f0fdf4,#dcfce7)',borderRadius:14,padding:24,textAlign:'center',marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color: ihtDue>0?'#991b1b':'#166534'}}>IHT DUE</div>
          <div style={{fontSize:48,fontWeight:900,color: ihtDue>0?'#dc2626':'#16a34a',margin:'6px 0'}}>{fmt(ihtDue)}</div>
          <div style={{fontSize:14,color:'#6b7280'}}>Net estate to beneficiaries: <strong>{fmt(netEstate)}</strong></div>
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
          {[
            ['Estate Value', fmt(estateVal)],
            ['Nil Rate Band', fmt(NRB)+(spouseDead?' (×2 = '+fmt(NRB*2)+')':'')],
            ['Residence NRB', fmt(rnrb)],
            ['Total Tax-Free Threshold', fmt(totalThreshold)],
            ['Charitable Gifts', fmt(charityAmt)],
            ['7-Year Gifts Added Back', fmt(giftsAmt)],
            ['Taxable Estate', fmt(taxableEstate)],
            ['IHT Rate', (ihtRate*100)+'% '+(charityPct>=0.1?'(reduced for charity)':'')],
            ['IHT Due', fmt(ihtDue)],
          ].map(([l,v])=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid #f0f0f0',fontSize:14}}>
              <span style={{color:'#6b7280'}}>{l}</span><strong>{v}</strong>
            </div>
          ))}
        </div>
        <div style={{background:'#f9fafb',borderRadius:12,padding:16,marginTop:16,fontSize:13,color:'#374151',lineHeight:1.6}}>
          <strong>2025/26:</strong> NRB £325,000. RNRB £175,000 (if leaving home to direct descendants). Both bands can double if transferring from deceased spouse. IHT rate 40% (36% if ≥10% to charity). Gifts made &gt;7 years ago are fully exempt.
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
</script>
</body>
</html>
